<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support Helpdesk | Student</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --primary: #6366f1; --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
    .top-nav {
      position: fixed; top: 0; width: 100%; background: var(--primary);
      padding: 0.7rem 2rem; z-index: 1000; display: flex;
      justify-content: space-between; align-items: center; box-sizing: border-box; height: 65px;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 38px; height: 38px; border-radius: 8px; background: white; padding: 5px; }
    .logo-icon img { width: 100%; height: 100%; object-fit: contain; }
    .logo-text { color: #ffffff; font-size: 1.2rem; font-weight: 600; }
    .container { max-width: 800px; margin: 0 auto; }
    .ticket-form { background: white; padding: 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    input, textarea, select { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
    .btn-open { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    .ticket-list { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .ticket-item { padding: 20px; border-bottom: 1px solid var(--border); }
    .status { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; float: right; }
    .open { background: #fee2e2; color: #dc2626; }
    .resolved { background: #d1fae5; color: #059669; }
    .back-link { text-decoration: none; color: #64748b; margin-bottom: 20px; display: inline-block; }
  </style>
</head>
<body>
  <header class="top-nav">
    <div class="logo">
      <div class="logo-icon"><img src="image.png" alt="Logo"></div>
      <span class="logo-text">Skill Hub <small style="font-weight: 400; opacity: 0.8;">| Student</small></span>
    </div>
  </header>
  <div class="container">
    <a href="student_dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Dashboard</a>
    <h1>Help & Support</h1>

    <div class="ticket-form">
      <h3>Open a New Ticket</h3>
      <label>Category</label>
      <select id="tCat">
        <option>Technical Issue</option>
        <option>Course Content Question</option>
        <option>Payment/Billing</option>
      </select>
      <label>Message</label>
      <textarea id="tMsg" rows="4" placeholder="Describe your problem..."></textarea>
      <button class="btn-open" onclick="createTicket()">Submit Ticket</button>
    </div>

    <h3>My Tickets</h3>
    <div class="ticket-list" id="ticketList"></div>
  </div>

  <script>
    function createTicket() {
      const session = JSON.parse(localStorage.getItem('active_session'));
      const msg = document.getElementById('tMsg').value;
      if(!msg) return alert("Please enter a message");

      const tickets = JSON.parse(localStorage.getItem('lms_tickets')) || [];
      tickets.push({
        id: Date.now(),
        student: session.name || session.username,
        category: document.getElementById('tCat').value,
        message: msg,
        status: 'open',
        reply: '',
        date: new Date().toLocaleDateString()
      });

      localStorage.setItem('lms_tickets', JSON.stringify(tickets));
      document.getElementById('tMsg').value = '';
      render();
    }

    function render() {
      const session = JSON.parse(localStorage.getItem('active_session'));
      const tickets = (JSON.parse(localStorage.getItem('lms_tickets')) || []).filter(t => t.student === (session.name || session.username));
      const list = document.getElementById('ticketList');
      
      list.innerHTML = tickets.reverse().map(t => `
        <div class="ticket-item">
          <span class="status ${t.status}">${t.status.toUpperCase()}</span>
          <strong>${t.category}</strong>
          <p style="font-size:14px; color:#475569;">${t.message}</p>
          ${t.reply ? `<div style="background:#f1f5f9; padding:10px; border-radius:6px; margin-top:10px;"><strong>Trainer Reply:</strong> ${t.reply}</div>` : ''}
        </div>
      `).join('');
    }
    render();
  </script>
</body>
</html>
