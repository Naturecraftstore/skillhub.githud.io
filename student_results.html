<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Results | Skill Hub Student</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { 
      --primary: #4f46e5; --bg: #f8fafc; --text: #1e293b; 
      --white: #ffffff; --border: #e2e8f0; --success: #10b981;
    }

    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); }
    
    .top-nav {
      position: fixed; top: 0; width: 100%; background: var(--primary);
      padding: 0.7rem 2rem; z-index: 1000; display: flex;
      justify-content: space-between; align-items: center; box-sizing: border-box;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; background: #fff; }
    .logo-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .logo-text { color: #ffffff; font-size: 1.2rem; font-weight: 600; }

    .app-container { display: flex; padding-top: 65px; }
    .sidebar { 
      width: 240px; height: calc(100vh - 65px); background: white; 
      position: fixed; left: 0; border-right: 1px solid var(--border); 
      padding: 1rem; box-sizing: border-box;
    }
    .nav-item { 
      display: flex; align-items: center; gap: 12px; padding: 12px 15px; 
      text-decoration: none; color: var(--text); border-radius: 8px; margin-bottom: 5px;
    }
    .nav-item.active { background: var(--primary); color: white; }

    .content { margin-left: 240px; flex: 1; padding: 2rem; }
    
    .result-card {
      background: white; padding: 25px; border-radius: 12px;
      margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border-left: 5px solid var(--success);
    }
    
    .result-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .score-circle {
      background: #f0fdf4; color: var(--success);
      width: 60px; height: 60px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; border: 2px solid var(--success);
    }
    
    .feedback-box {
      background: #f1f5f9; padding: 15px; border-radius: 8px;
      margin-top: 15px; font-style: italic; color: #475569;
      position: relative;
    }
    .feedback-box::before {
      content: "\f10d"; font-family: "Font Awesome 5 Free"; font-weight: 900;
      position: absolute; top: -10px; left: 10px; color: var(--primary); background: var(--white); padding: 0 5px;
    }
  </style>
</head>
<body>

  <header class="top-nav">
    <div class="logo">
      <div class="logo-icon"><a href="student_dashboard.html"><img src="image.png" alt="Logo"></a></div>
      <span class="logo-text">Skill Hub <small>| Student</small></span>
    </div>
  </header>

  <div class="app-container">
    <aside class="sidebar">
      <nav>
        <a href="student_dashboard.html" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
        <a href="student_courses.html" class="nav-item"><i class="fas fa-book"></i> My Courses</a>
        <a href="student_materials.html" class="nav-item"><i class="fas fa-folder-open"></i> Materials</a>
        <a href="student_videos.html" class="nav-item"><i class="fas fa-play-circle"></i> Video Lessons</a>
        <a href="student_assignments.html" class="nav-item active"><i class="fas fa-tasks"></i> Assignments</a>
        <a href="student_sessions.html" class="nav-item"><i class="fas fa-calendar-alt"></i> <span>Live Sessions</span></a>
        <a href="student_results.html" class="nav-item"><i class="fas fa-poll-h"></i> My Results</a>
        <a href="messages.html" class="nav-item"><i class="fas fa-envelope"></i> Messages</a>
        <a href="contact.html" class="nav-item"><i class="fas fa-envelope"></i> Contact Us</a>
        <a href="notifications.html" class="nav-item"><i class="fas fa-bell"></i> Notifications</a>
        <a href="index.html" class="nav-item"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </aside>

    <main class="content">
      <h1>My Academic Performance</h1>
      <p style="color: #64748b; margin-bottom: 30px;">Review your grades and trainer feedback below.</p>
      
      <div id="resultsList">
          </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('active_session'));
      const submissions = JSON.parse(localStorage.getItem('lms_submissions')) || [];
      
      // Filter for this student's graded work
      const myGradedWork = submissions.filter(s => 
        s.studentEmail === user.username && s.status === 'Graded'
      );

      const container = document.getElementById('resultsList');

      if (myGradedWork.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 50px;">
            <i class="fas fa-medal" style="font-size: 3rem; color: #e2e8f0; margin-bottom: 15px;"></i>
            <p style="color: #94a3b8;">No graded assignments yet. Keep up the good work!</p>
          </div>`;
        return;
      }

      container.innerHTML = myGradedWork.map(r => `
        <div class="result-card">
          <div class="result-header">
            <div>
              <h3 style="margin:0; color:var(--primary);">${r.assignmentTitle}</h3>
              <p style="font-size: 0.8rem; color:#64748b; margin: 5px 0;">Graded on: ${r.submittedAt}</p>
            </div>
            <div class="score-circle">${r.score}</div>
          </div>
          <div class="feedback-box">
            ${r.feedback || "No specific comments provided."}
            <div style="text-align:right; font-size: 0.75rem; margin-top: 10px; font-weight: bold; font-style: normal;">
              — Your Trainer
            </div>
          </div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
