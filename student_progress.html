<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Progress | Skill Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --primary: #4f46e5; --bg: #f8fafc; --white: #ffffff; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
    .top-nav {
      position: fixed; top: 0; width: 100%; background: var(--primary);
      padding: 0.7rem 2rem; z-index: 1000; display: flex;
      justify-content: space-between; align-items: center; box-sizing: border-box; height: 65px;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 38px; height: 38px; border-radius: 8px; background: white; padding: 5px; }
    .logo-icon img { width: 100%; height: 100%; object-fit: contain; }
    .logo-text { color: #ffffff; font-size: 1.2rem; font-weight: 600; }
    .container { max-width: 800px; margin: 0 auto; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .stat-card h3 { margin: 0; color: #64748b; font-size: 14px; }
    .stat-card p { font-size: 24px; font-weight: bold; margin: 10px 0 0; color: var(--primary); }
    .chart-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .back-link { text-decoration: none; color: var(--primary); font-weight: 600; margin-bottom: 20px; display: inline-block; }
  </style>
</head>
<body>
  <header class="top-nav">
    <div class="logo">
      <div class="logo-icon"><img src="image.png" alt="Logo"></div>
      <span class="logo-text">Skill Hub <small style="font-weight: 400; opacity: 0.8;">| Student</small></span>
    </div>
  </header>
  <div class="container">
    <a href="student_dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
    <h1>Learning Analytics</h1>

    <div class="stats-grid">
      <div class="stat-card"><h3>Total Assignments</h3><p id="totalCount">0</p></div>
      <div class="stat-card"><h3>Completed</h3><p id="doneCount">0</p></div>
      <div class="stat-card"><h3>Current Grade</h3><p id="avgGrade">0%</p></div>
    </div>

    <div class="chart-container">
      <canvas id="progressChart"></canvas>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const session = JSON.parse(localStorage.getItem('active_session'));
      const studentName = session.name || session.username;
      
      const allTasks = JSON.parse(localStorage.getItem('lms_assignments')) || [];
      const allSubs = JSON.parse(localStorage.getItem('lms_submissions')) || [];
      
      const mySubs = allSubs.filter(s => s.studentName === studentName);
      const gradedSubs = mySubs.filter(s => s.status === 'graded');

      // Calculate Stats
      const total = allTasks.length;
      const completed = mySubs.length;
      const avg = gradedSubs.length > 0 
        ? (gradedSubs.reduce((acc, curr) => acc + parseInt(curr.grade), 0) / gradedSubs.length).toFixed(1)
        : 0;

      document.getElementById('totalCount').innerText = total;
      document.getElementById('doneCount').innerText = completed;
      document.getElementById('avgGrade').innerText = avg + "%";

      // Render Chart
      const ctx = document.getElementById('progressChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Course Progress'],
          datasets: [{
            label: 'Completed Assignments',
            data: [completed],
            backgroundColor: '#4f46e5',
            borderRadius: 8
          }, {
            label: 'Total Required',
            data: [total],
            backgroundColor: '#e2e8f0',
            borderRadius: 8
          }]
        },
        options: { 
          responsive: true,
          scales: { y: { beginAtZero: true, max: total + 1 } }
        }
      });
    });
  </script>
</body>
</html>
