<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Submissions | Skill Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
:root { 
    --primary: #4f46e5;
    --primary-dark: #3730a3;
    --primary-soft: #eef2ff;
    --success: #10b981; 
    --danger: #ef4444;
    --warning: #f59e0b;
    --bg: #f8fafc; 
    --sidebar-bg: #ffffff;
    --text-main: #1e293b; 
    --text-muted: #64748b;
    --white: #ffffff; 
    --border: #e2e8f0; 
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    --radius-lg: 12px;
    --radius-md: 8px;
}

* { box-sizing: border-box; transition: all 0.2s ease-in-out; }

body { 
    font-family: 'Inter', system-ui, -apple-system, sans-serif; 
    margin: 0; 
    background: var(--bg); 
    color: var(--text-main);
    line-height: 1.5;
    overflow-x: hidden;
}

/* --- TOP NAVIGATION --- */
.top-nav {
    position: fixed; top: 0; width: 100%; height: 70px;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem; z-index: 1000; 
    display: flex; justify-content: space-between; align-items: center;
}

.logo-section { display: flex; align-items: center; gap: 15px; }

/* --- SIDEBAR & CONTENT TOGGLE LOGIC --- */
.sidebar { 
    width: 260px; height: calc(100vh - 70px); 
    background: var(--sidebar-bg); 
    position: fixed; left: 0; top: 70px; border-right: 1px solid var(--border); 
    padding: 1.5rem 1rem;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 999;
}

.content { 
    margin-left: 260px; 
    flex: 1; 
    padding: 2rem; 
    max-width: 1400px; 
    padding-top: 90px;
    transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Toggle States */
.sidebar.collapsed { transform: translateX(-260px); }
.content.expanded { margin-left: 0; }

#sidebarToggle { cursor: pointer; padding: 10px; font-size: 1.2rem; color: var(--text-muted); }
#sidebarToggle:hover { color: var(--primary); }

.logo-icon img { height: 32px; width: auto; border-radius: 6px; }
.logo-text { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); }

.nav-right { display: flex; align-items: center; gap: 20px; }
.top-link { color: var(--text-muted); font-size: 1.1rem; text-decoration: none; position: relative; }
.logout-btn { 
    background: var(--primary-soft); color: var(--primary);
    padding: 8px 16px; border-radius: var(--radius-md);
    text-decoration: none; font-weight: 600; font-size: 0.9rem;
}

/* --- NAVIGATION ITEMS --- */
.nav-item { 
    display: flex; align-items: center; gap: 12px; padding: 12px 15px; 
    text-decoration: none; color: var(--text-muted); border-radius: var(--radius-md); 
    margin-bottom: 5px; font-weight: 500;
}
.nav-item:hover { background: var(--primary-soft); color: var(--primary); transform: translateX(4px); }
.nav-item.active { background: var(--primary); color: white; box-shadow: var(--shadow-md); }

/* --- DASHBOARD WIDGETS --- */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 30px; }
.stat-card { 
    background: white; padding: 24px; border-radius: var(--radius-lg); 
    border: 1px solid var(--border); box-shadow: var(--shadow-sm);
}
.stat-card h3 { margin: 0; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
.stat-card p { margin: 0; font-size: 2rem; font-weight: 800; }

.card { background: var(--white); padding: 30px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-md); }

/* --- TABLE --- */
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th { text-align: left; padding: 14px; background: #fafafa; border-bottom: 2px solid var(--border); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
td { padding: 18px 14px; border-bottom: 1px solid var(--border); }

.grade-input { width: 75px; padding: 10px; border: 2px solid var(--border); border-radius: var(--radius-md); text-align: center; font-weight: 700; color: var(--primary); }
.btn-save { background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; }
.badge { padding: 5px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 800; display: inline-block; }
.badge-pending { background: #fef3c7; color: #92400e; }
.badge-graded { background: #dcfce7; color: #166534; }

@media (max-width: 992px) {
    .sidebar { transform: translateX(-260px); }
    .sidebar.active-mobile { transform: translateX(0); }
    .content { margin-left: 0; }
}
    </style>
</head>
<body>

<header class="top-nav">
    <div class="logo-section">
      <i class="fas fa-bars" id="sidebarToggle"></i>
      <div class="logo-icon"><a href="trainer_dashboard.html"><img src="image.png" alt="Logo"></a></div>
      <span class="logo-text">Skill Hub</span>
    </div>
    <div class="nav-right">
      <a href="notifications.html" class="top-link" title="Notifications">
          <i class="fas fa-bell"></i>
          <span class="badge" id="notifBadge">0</span>
      </a>
      <a href="messages.html" class="top-link" title="Chat"><i class="fas fa-comment-dots"></i></a>
      <a href="trainer_profile.html" class="top-link" id="navTrainerDisplay"><i class="fas fa-user-circle"></i></a>
      <a href="index.html" class="logout-btn" title="Logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
</header>

<div class="app-container">
    <aside class="sidebar" id="mainSidebar">
        <nav>
            <a href="trainer_dashboard.html" class="nav-item"><i class="fas fa-home"></i> <span>Dashboard</span></a>
            <a href="trainer_grading.html" class="nav-item active"><i class="fas fa-check-double"></i> <span>Grading</span></a>
            <a href="trainer_add_assignment.html" class="nav-item"><i class="fas fa-tasks"></i> <span>Assignments</span></a>
            <a href="trainer_add_video.html" class="nav-item"><i class="fas fa-video"></i> <span>Videos</span></a>
            <a href="trainer_add_material.html" class="nav-item"><i class="fas fa-file-upload"></i> <span>Materials</span></a>
            <a href="trainer_add_session.html" class="nav-item"><i class="fas fa-calendar-alt"></i> <span>Live Sessions</span></a>
        </nav>
    </aside>

    <main class="content" id="mainContent">
        <div class="stats-grid">
            <div class="stat-card"><h3>Total Received</h3><p id="statTotal">0</p></div>
            <div class="stat-card"><h3>Pending Review</h3><p id="statPending" style="color: #ef4444;">0</p></div>
            <div class="stat-card"><h3>Completed</h3><p id="statGraded" style="color: var(--success);">0</p></div>
        </div>

        <div class="card">
            <h2>Student Submissions</h2>
            <div class="filter-section">
                <label style="font-weight:600;">Filter Student:</label>
                <select id="studentFilter" onchange="loadSubmissions()">
                    <option value="all">All Students</option>
                </select>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Assignment</th>
                        <th>File</th>
                        <th>Submitted</th>
                        <th>Score %</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="submissionBody">
                    <tr><td colspan="6" style="text-align:center; padding:20px;">Initializing Database...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script>
    // --- SIDEBAR TOGGLE LOGIC ---
    document.getElementById('sidebarToggle').addEventListener('click', () => {
        const sidebar = document.getElementById('mainSidebar');
        const content = document.getElementById('mainContent');
        sidebar.classList.toggle('collapsed');
        content.classList.toggle('expanded');
    });

    // --- DATABASE LOGIC ---
    const DB_NAME = 'SkillHubDB';
    const STORE_NAME = 'submissions';
    let db;

    const request = indexedDB.open(DB_NAME, 1);
    request.onsuccess = (e) => {
        db = e.target.result;
        populateFilters();
        loadSubmissions();
    };

    function populateFilters() {
        const session = JSON.parse(localStorage.getItem('active_session') || '{}');
        const allUsers = JSON.parse(localStorage.getItem('skillhub_users')) || [];
        const myStudents = allUsers.filter(u => u.role === 'student' && u.course === session.course);
        
        const filter = document.getElementById('studentFilter');
        myStudents.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.email;
            opt.textContent = s.name;
            filter.appendChild(opt);
        });
    }

    function loadSubmissions() {
        const session = JSON.parse(localStorage.getItem('active_session') || '{}');
        const selectedFilter = document.getElementById('studentFilter').value;
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        
        store.getAll().onsuccess = (e) => {
            let data = e.target.result.filter(s => s.course === session.course);
            if (selectedFilter !== 'all') {
                data = data.filter(s => s.studentEmail === selectedFilter);
            }
            renderTable(data);
            updateStats(data);
        };
    }

    function renderTable(data) {
        const tbody = document.getElementById('submissionBody');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px;">No submissions found.</td></tr>';
            return;
        }

        tbody.innerHTML = data.reverse().map(s => `
            <tr>
                <td><strong>${s.studentName}</strong><br><small>${s.studentEmail}</small></td>
                <td>ID: ${s.taskId}</td>
                <td>
                    <a href="#" onclick="downloadFile(${s.id})" class="btn-download">
                        <i class="fas fa-download"></i> ${s.fileName}
                    </a>
                </td>
                <td><small>${s.timestamp}</small></td>
                <td>
                    <input type="number" id="grade-${s.id}" class="grade-input" value="${s.grade || ''}" min="0" max="100">
                </td>
                <td>
                    <button class="btn-save" onclick="saveGrade(${s.id})">Save</button>
                    <div style="margin-top:5px;">
                        <span class="badge ${s.grade ? 'badge-graded' : 'badge-pending'}">
                            ${s.grade ? 'Graded' : 'Pending'}
                        </span>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    window.saveGrade = function(id) {
        const gradeValue = document.getElementById(`grade-${id}`).value;
        if (gradeValue === "" || gradeValue < 0 || gradeValue > 100) return alert("Enter valid grade (0-100)");

        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);

        store.get(id).onsuccess = (e) => {
            const data = e.target.result;
            data.grade = gradeValue;
            store.put(data).onsuccess = () => {
                alert("Grade saved successfully!");
                loadSubmissions();
            };
        };
    };

    function updateStats(data) {
        document.getElementById('statTotal').innerText = data.length;
        document.getElementById('statGraded').innerText = data.filter(s => s.grade).length;
        document.getElementById('statPending').innerText = data.filter(s => !s.grade).length;
    }

    window.downloadFile = function(id) {
        const tx = db.transaction(STORE_NAME, 'readonly');
        tx.objectStore(STORE_NAME).get(id).onsuccess = (e) => {
            const record = e.target.result;
            const url = URL.createObjectURL(record.fileData);
            const a = document.createElement('a');
            a.href = url;
            a.download = `SKILLHUB_${record.studentName}_${record.fileName}`;
            a.click();
            URL.revokeObjectURL(url);
        };
    };
</script>
</body>
</html>
