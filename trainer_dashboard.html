        <div class="card">
          <h3><i class="fas fa-bolt" style="color:var(--warning)"></i> Quick Actions</h3>
          <a href="trainer_add_assignment.html" class="quick-action-link"><i class="fas fa-plus-circle"></i> New Assignment</a>
          <a href="trainer_add_video.html" class="quick-action-link"><i class="fas fa-play-circle"></i> Upload Video</a>
          <a href="trainer_add_material.html" class="quick-action-link"><i class="fas fa-file-alt"></i> Add Materials</a>
          <a href="trainer_add_session.html" class="quick-action-link"><i class="fas fa-calendar-plus"></i> Schedule Live</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('active_session'));
      
      // 1. Security Check
      if (!user || user.role !== 'trainer') { 
          window.location.href = 'index.html'; 
          return; 
      }

      // 2. Sidebar Toggle Logic
      const sidebar = document.getElementById('sidebar');
      const content = document.getElementById('mainContent');
      document.getElementById('sidebarToggle').onclick = () => {
        if(window.innerWidth > 768) {
          sidebar.classList.toggle('collapsed');
          content.classList.toggle('expanded');
        } else {
          sidebar.classList.toggle('mobile-active');
        }
      };

      // 3. Setup Identity
      const currentTrainerName = user.name || user.username;
      document.getElementById('welcomeText').innerText = `Welcome back, ${currentTrainerName}!`;
      document.getElementById('navTrainerDisplay').innerHTML = `<i class="fas fa-user-circle"></i> ${currentTrainerName}`;

      // 4. Data Fetching
      const allUsers = JSON.parse(localStorage.getItem('skillhub_users')) || [];
      const submissions = JSON.parse(localStorage.getItem('lms_submissions')) || [];
      const assignments = JSON.parse(localStorage.getItem('lms_assignments')) || [];
      const allNotifications = JSON.parse(localStorage.getItem('lms_notifications')) || [];

      // 5. Statistics Calculation (Trainer-Specific)
      const myStudents = allUsers.filter(u => u.role === 'student' && u.trainer === currentTrainerName);
      const myStudentNames = myStudents.map(s => s.name);
      
      document.getElementById('studentCount').innerText = myStudents.length;
      document.getElementById('assignmentCount').innerText = assignments.length;
      
      const myPending = submissions.filter(s => 
          myStudentNames.includes(s.studentName) && s.status !== 'Graded'
      ).length;
      document.getElementById('pendingCount').innerText = myPending;

      // 6. Notification Badge
      const unreadCount = allNotifications.filter(n => n.recipient === user.username && !n.read).length;
      const badge = document.getElementById('notifBadge');
      if (unreadCount > 0) {
          badge.innerText = unreadCount;
          badge.style.display = 'block';
      }

      // 7. Recent Activity (Student-Specific Filter)
      const list = document.getElementById('recentSubmissions');
      const myRecentSubmissions = submissions
        .filter(s => myStudentNames.includes(s.studentName))
        .slice(-5)
        .reverse();
      
      list.innerHTML = myRecentSubmissions.map(s => `
        <div class="activity-item">
          <div>
            <div style="font-weight:600; color:var(--text);">${s.studentName}</div>
            <div style="font-size:0.85rem; color:var(--text-muted);">Submitted: <em>${s.assignmentTitle}</em></div>
            <div style="font-size:0.75rem; color:#94a3b8; margin-top:4px;">
                <i class="far fa-clock"></i> ${s.submittedAt || 'Just now'}
            </div>
          </div>
          <a href="trainer_grading.html" class="btn-review">Review</a>
        </div>
      `).join('') || `
        <div style="text-align:center; padding:30px; color:#94a3b8;">
            <i class="fas fa-inbox fa-2x" style="margin-bottom:10px; display:block; opacity:0.5;"></i>
            <p>No student submissions yet.</p>
        </div>`;
    });
  </script>
</body>
</html>
