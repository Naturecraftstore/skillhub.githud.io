<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support | Skill Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    :root { 
        --primary: #4f46e5; --accent: #818cf8; 
        --text: #1e293b; --white: #ffffff; 
        --border: rgba(226, 232, 240, 0.4); 
    }

    body { 
        font-family: 'Segoe UI', sans-serif; 
        margin: 0; 
        /* SETTING YOUR LOCAL IMAGE */
        background-image: url('image.png');
        background-size: 90%;
        background-position: center;
        background-attachment: fixed;
        color: var(--text);
        min-height: 100vh;
    }
    
    /* Top Navigation - Translucent */
    .top-nav {
        position: fixed; top: 0; width: 100%; 
        background: rgba(79, 70, 229, 0.9); 
        backdrop-filter: blur(10px);
        padding: 0.7rem 2rem; z-index: 1000; display: flex;
        justify-content: space-between; align-items: center; box-sizing: border-box;
    }
    .logo-text { color: white; font-size: 1.2rem; font-weight: 600; text-decoration: none; }

    .container { max-width: 1000px; margin: 100px auto 40px; padding: 0 20px; }

    /* Heading Visibility */
    .container h1 { color: rgb(5, 5, 5); text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
    .container > div > p { color: #070707 !important; font-weight: 500; }

    .contact-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; }

    /* Left Column: Glass Info Card */
    .info-card { 
       
        backdrop-filter: blur(15px);
        padding: 30px; border-radius: 16px; 
        border: 1px solid var(--border); 
        box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    .contact-method { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 25px; }
    .icon-box { 
        width: 45px; height: 45px; background: var(--primary); color: white; 
        border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    }
    .method-text h4 { margin: 0; font-size: 1rem; color: var(--primary); }
    .method-text p { margin: 5px 0 0; font-size: 0.9rem; color: #334155; font-weight: 500; }

    /* Right Column: Glass Form Card */
    .form-card { 
        
        backdrop-filter: blur(15px);
        padding: 40px; border-radius: 16px; 
        border: 1px solid var(--border);
        box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--primary); }
    
    input, select, textarea { 
        width: 100%; padding: 12px; border: 1px solid #cbd5e1; 
        border-radius: 8px; outline: none; font-family: inherit; box-sizing: border-box;
        background: rgba(255, 255, 255, 0.8);
    }
    input:focus, select:focus, textarea:focus { 
        border-color: var(--primary); 
        background: white;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); 
    }
    
    .btn-send { 
        background: var(--primary); color: white; border: none; padding: 14px 28px; 
        border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.3s;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .btn-send:hover { background: #4338ca; transform: translateY(-1px); }

    .back-link { display: inline-flex; align-items: center; gap: 8px; color: white; text-decoration: none; font-size: 0.9rem; }

    @media (max-width: 768px) { .contact-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="top-nav">
    <a href="#" id="dynamicBack" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    <div class="logo-text">Skill Hub Help Desk</div>
    <div style="width: 120px;"></div> </header>

<div class="container">
    <div style="text-align: center; margin-bottom: 40px;">
        <h1 style="margin-bottom: 10px;">How can we help you?</h1>
        <p style="color: #64748b;">Send us a message and our team will get back to you within 24 hours.</p>
    </div>

    <div class="contact-grid">
        <div class="info-card">
            <h3>Direct Contact</h3>
            <div class="contact-method">
                <div class="icon-box"><i class="fas fa-envelope"></i></div>
                <div class="method-text">
                    <h4>Email Support</h4>
                    <p>support@skillhub.com</p>
                </div>
            </div>
            <div class="contact-method">
                <div class="icon-box"><i class="fas fa-phone"></i></div>
                <div class="method-text">
                    <h4>Phone</h4>
                    <p>+1 (555) 000-1234</p>
                </div>
            </div>
            <div class="contact-method">
                <div class="icon-box"><i class="fas fa-map-marker-alt"></i></div>
                <div class="method-text">
                    <h4>Headquarters</h4>
                    <p>123 Learning Lane<br>Education City, ED 4567</p>
                </div>
            </div>
        </div>

        <div class="form-card">
            <form id="contactForm">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="senderName" readonly style="background: #f1f5f9;">
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <select id="subject" required>
                        <option value="">Select a reason...</option>
                        <option value="technical">Technical Issue</option>
                        <option value="billing">Course Access / Billing</option>
                        <option value="feedback">Feedback</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="message" rows="5" placeholder="Describe your issue in detail..." required></textarea>
                </div>
                <button type="submit" class="btn-send">Send Message</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const user = JSON.parse(localStorage.getItem('active_session'));
        if (!user) { window.location.href = 'index.html'; return; }

        // 1. Set Name
        document.getElementById('senderName').value = user.name || user.username;

        // 2. Set Dynamic Back Link
        const backBtn = document.getElementById('dynamicBack');
        if (user.role === 'admin') backBtn.href = 'admin_dashboard.html';
        else if (user.role === 'trainer') backBtn.href = 'trainer_dashboard.html';
        else backBtn.href = 'student_dashboard.html';

        // 3. Handle Form Submission
        document.getElementById('contactForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Create a pseudo-ticket
            const ticket = {
                id: Date.now(),
                from: user.username,
                role: user.role,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value,
                date: new Date().toLocaleString()
            };

            // In a real app, this goes to a database. 
            // Here we show a success message.
            alert(`Thank you, ${user.name}! Your message regarding "${ticket.subject}" has been sent.`);
            
            // Redirect back
            window.location.href = backBtn.href;
        });
    });
</script>
</body>
</html>
