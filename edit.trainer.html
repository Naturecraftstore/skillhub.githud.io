<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Trainer | Skill Hub LMS (Local Storage)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ============ CSS (Derived from edit_trainer.html) ============ */
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --text: #1e293b;
      --white: #ffffff;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    body { 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      background: var(--bg); 
      color: var(--text); 
    }

    /* Top Nav */
    .top-nav { 
      background: var(--primary); 
      color: white; 
      padding: 1rem 2rem; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: bold; }
    .top-nav-links a { color: white; text-decoration: none; margin-left: 15px; }

    /* Content Area */
    .content-area { padding: 2rem; }
    .page-header { text-align: center; margin-bottom: 20px; }
    
    .card { 
      background: var(--white); 
      padding: 25px; 
      border-radius: 12px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
      max-width: 600px; 
      margin: 0 auto; 
    }

    .form-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 15px; 
    }
    
    .form-grid input { 
      padding: 10px; 
      width: 100%; 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      box-sizing: border-box; 
    }

    input[readonly] { background-color: #f1f5f9; cursor: not-allowed; }

    .form-actions { 
      margin-top: 20px; 
      display: flex; 
      gap: 10px; 
    }

    .btn-add { 
      background: var(--primary); 
      color: white; 
      border: none; 
      padding: 10px 20px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 600; 
      flex: 1;
    }

    .btn-cancel { 
      background: #64748b; 
      color: white; 
      text-decoration: none; 
      padding: 10px 20px; 
      border-radius: 6px; 
      text-align: center;
      flex: 1;
    }

    .alert {
      padding: 12px;
      background: #dcfce7;
      color: #166534;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header class="top-nav">
    <div class="navbar">
      <div class="logo">
        <div style="width:30px; height:30px; background:white; border-radius:4px;"></div>
        <span>Skill Hub</span>
      </div>
    </div>
    <nav class="top-nav-links">
        <a href="#" onclick="window.history.back()"><i class="fas fa-arrow-left"></i> Back</a>
    </nav>
  </header>

  <main class="content-area">
    <div class="page-header">
      <h1>Edit Trainer</h1>
    </div>

    <div id="successAlert" class="alert">Trainer profile updated successfully!</div>

    <div class="card form-card">
      <form id="editTrainerForm">
        <div class="form-grid">
          <input type="text" id="trainer_id" readonly placeholder="Trainer ID">
          <input type="text" id="name" placeholder="Name" required>
          <input type="email" id="email" placeholder="Email" required>
          <input type="text" id="phone" placeholder="Phone" required>
          <input type="text" id="subject" placeholder="Subject" required>
          <input type="text" id="username" placeholder="Username" required>
          <input type="password" id="password" placeholder="New Password (leave blank to keep)">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-add"><i class="fas fa-save"></i> Save Changes</button>
          <a href="#" class="btn-cancel" onclick="window.history.back()"><i class="fas fa-times"></i> Cancel</a>
        </div>
      </form>
    </div>
  </main>
</div>

<script>
/* ============ JS & LOCAL STORAGE LOGIC ============ */

const STORAGE_KEY = 'skillhub_current_trainer';

// 1. Initial Mock Data
const defaultTrainer = {
  id: 1,
  trainer_id: "TRN-2024-001",
  name: "Sarah Williams",
  email: "sarah.w@skillhub.com",
  phone: "+1 555-0102",
  subject: "Data Science",
  username: "swilliams_pro"
};

// 2. Load Data into Form
function loadTrainer() {
  let data = localStorage.getItem(STORAGE_KEY);
  
  // Initialize with default if storage is empty
  if (!data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultTrainer));
    data = JSON.stringify(defaultTrainer);
  }
  
  const trainer = JSON.parse(data);

  // Populate inputs
  document.getElementById('trainer_id').value = trainer.trainer_id;
  document.getElementById('name').value = trainer.name;
  document.getElementById('email').value = trainer.email;
  document.getElementById('phone').value = trainer.phone;
  document.getElementById('subject').value = trainer.subject;
  document.getElementById('username').value = trainer.username;
}

// 3. Save Changes to Local Storage
document.getElementById('editTrainerForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const updatedTrainer = {
    trainer_id: document.getElementById('trainer_id').value,
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    subject: document.getElementById('subject').value,
    username: document.getElementById('username').value
  };

  // Save to Local Storage
  localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedTrainer));

  // Show Success Message
  const alert = document.getElementById('successAlert');
  alert.style.display = 'block';
  setTimeout(() => { alert.style.display = 'none'; }, 3000);
});

// Initialize on page load
window.onload = loadTrainer;
</script>

</body>
</html>
